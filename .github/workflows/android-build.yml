name: Build DIZEUR Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract DIZEUR source
        run: unzip -q DizeurAndroid-alpha-1.1.zip

      - name: Build debug APK
        run: gradle -p DizeurAndroid assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIZEUR-1.1-alpha-debug
          path: DizeurAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
